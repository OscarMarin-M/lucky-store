targets:
  $default:
    builders:
      drift_dev:
        options:
          # ISO-8601 text keeps full precision (ints would truncate to seconds)
          # and is readable when debugging. Do not change after release
          # without a migration.
          store_date_time_values_as_text: true
          databases:
            default: lib/data/database/app_database.dart
          schema_dir: drift_schemas
